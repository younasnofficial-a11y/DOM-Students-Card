<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Skill Cards</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="#">
                <img src="images.png" alt="" width="40" height="40" class="rounded-circle bg-white">
                <span>Student Hub</span>
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <div>
                <h2 class="mb-1">Students</h2>
                <p class="text-secondary mb-0">Browse students and explore their skills.</p>
            </div>

            <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0" for="skill-filter">Filter by skill</label>
                <select class="form-select w-auto" id="skill-filter">
                    <option value="all">All skills</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="students-container"></div>
        <p class="text-secondary mt-4 d-none" id="empty-message">No students have this skill yet.</p>

    </div>

    <script src="index.js"></script>

</body>
</html>
